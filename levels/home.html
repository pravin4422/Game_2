<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Game</title>

<style>
    :root {
         --phone-height: 92vh;
          --phone-width: 
          calc(var(--phone-height) * (9 / 16));
         }
    body {
        margin: 0;
        height: 100vh;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        background: #000; 
        font-family: Arial; 
    }
    
    .bg-blur {
         position: fixed; 
         top: 0; left: 0; 
         width: 100%; 
         height: 100%; 
         background: url("../assets/home/homeScreen.webp") center/cover no-repeat; 
         filter: blur(20px); 
         z-index: -1; 
        }
    
    .mobile-frame {
        width: var(--phone-width); 
        height: var(--phone-height);
        max-width: 450px; 
        max-height: 800px; 
        border-radius: 25px; 
        overflow: hidden;
        display: flex; 
        flex-direction: column; 
        align-items: center;
        background: url("../assets/home/homeScreen.webp") center/cover no-repeat;
        box-shadow: 0 0 40px rgba(0,0,0,0.8); 
        border: 6px solid #222;
        position: relative; /* Essential for positioning icons at bottom */
    }

    /* Center Buttons Area */
    .btn-column {
        display: flex; 
        flex-direction: column; 
        align-items: center;
        gap: 10px; 
        margin-top: 250px;
    }
    .menu-btn {
        background: none; 
        border: none; 
        cursor: pointer; 
        transition: transform 0.2s; 
    }
    .menu-btn:hover { transform: scale(1.05); }
    .menu-btn img {
         width: 100%; 
         max-width: 220px; 
         height: auto; 
        }

    /* Bottom Icons Area */
    .nav {
        position: absolute; bottom: 20px; 
        display: flex; gap: 10px; right: 20px;
    }
    .arrow { background: none; border: none; cursor: pointer; width: 50px; }
    .arrow img { width: 100%; }
</style>
</head>
<body>

<div class="bg-blur"></div>

<div class="mobile-frame">
    

    <div class="btn-column">
        <button class="menu-btn" onclick="window.location.href='level1.html'"><img src="../assets/home/play.webp"></button>
        <button class="menu-btn" onclick="window.location.href='level1to10.html'"><img src="../assets/home/levels.webp"></button>
        <button class="menu-btn"><img src="../assets/home/moregames.webp"></button>
    </div>

    <div class="nav">
        <!-- <button class="arrow"><img src="settings.webp"></button> -->
        <button class="arrow"><img src="../assets/home/share.webp"></button>
        <button class="arrow"><img src="../assets/home/important.webp"></button>
    </div>
</div>

</body>
</html>
